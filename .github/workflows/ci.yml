name: CI Pipeline SGPD

on:
  push:
    branches: [ main, feature/revisao-tecnica-mvp ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: usuario
          POSTGRES_PASSWORD: senha
          POSTGRES_DB: sgpd_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install fastapi sqlalchemy pydantic bcrypt pytest httpx psycopg2-binary

    - name: Validar integridade dos módulos e conexão com Banco
      run: |
        python -c "import database, models, schemas, main; print('Todos os modulos carregados e banco conectado com sucesso!')"
